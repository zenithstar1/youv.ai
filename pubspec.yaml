name: skin_analysis_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.10.0'

dependencies:
  flutter:
    sdk: flutter
  

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # ---------- FIREBASE ----------
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.5.1
  firebase_storage: ^12.3.4

  # ---------- AUTH ----------
  google_sign_in: ^7.2.0

