<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Skin Analysis Application">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=()">
  <meta name="referrer" content="no-referrer">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Skin Analysis">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <title>Skin Analysis</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    :root {
      --app-height: 100lvh;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: var(--app-height);
      min-height: var(--app-height);
      overflow: hidden;
      background-color: #FDF8F3;
    }

    flutter-view,
    flt-glass-pane,
    flt-scene-host,
    flt-scene {
      position: fixed !important;
      top: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: var(--app-height) !important;
      min-height: var(--app-height) !important;
      max-height: var(--app-height) !important;
      transform: translateZ(0);
    }

    video {
      transform: scaleX(-1);
      /* Override camera_web plugin's object-fit:cover which zooms the
         face to fill the container.  'contain' preserves the native
         aspect ratio so the full face is visible inside the oval guide. */
      object-fit: contain !important;
    }

    #loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: fixed;
      inset: 0;
      height: var(--app-height);
      min-height: var(--app-height);
      background-color: #FDF8F3;
      z-index: 9999;
      opacity: 1;
      visibility: visible;
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    #loading.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader {
      border: 5px solid #f3f3f3;
      border-top: 5px solid #D4999F;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 20px;
      color: #6B3E3E;
      font-family: 'Roboto', sans-serif;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div id="loading">
    <div class="loader"></div>
    <div class="loading-text">Loading Skin Analysis...</div>
  </div>

  <script>
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }

    var backGuardActive = false;
    var keyboardRecentUntil = 0;

    function isEditableElement(el) {
      if (!el) return false;
      var tag = (el.tagName || '').toUpperCase();
      return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable === true;
    }

    function hasActiveEditable() {
      return isEditableElement(document.activeElement);
    }

    function isKeyboardLikelyOpen() {
      if (!window.visualViewport) return false;
      return window.visualViewport.height < (window.innerHeight * 0.9);
    }

    function keyboardActiveOrRecent() {
      return hasActiveEditable() || isKeyboardLikelyOpen() || Date.now() < keyboardRecentUntil;
    }

    function armBackGuard() {
      if (backGuardActive) return;
      try {
        history.pushState({ __kbGuard: true }, document.title);
        backGuardActive = true;
      } catch (e) {}
    }

    function consumeBackForKeyboard() {
      if (!backGuardActive && !hasActiveEditable() && !isKeyboardLikelyOpen()) {
        return false;
      }

      var active = document.activeElement;
      if (active && typeof active.blur === 'function') {
        active.blur();
      }

      scheduleViewportResync();
      setTimeout(scheduleViewportResync, 120);

      try {
        history.pushState({ __kbGuard: true }, document.title);
        backGuardActive = true;
      } catch (e) {}

      return true;
    }

    function trapBackWhenKeyboardActive(event) {
      if (!keyboardActiveOrRecent()) {
        return;
      }

      var active = document.activeElement;
      if (active && typeof active.blur === 'function') {
        active.blur();
      }

      scheduleViewportResync();
      setTimeout(scheduleViewportResync, 120);

      try {
        history.pushState({ __kbGuard: true }, document.title);
      } catch (e) {}

      if (event && typeof event.stopImmediatePropagation === 'function') {
        event.stopImmediatePropagation();
      }
      if (event && typeof event.stopPropagation === 'function') {
        event.stopPropagation();
      }

      // Last-resort workaround for device/browser viewport bugs after back-key
      // keyboard dismiss: hard-reload to reset the canvas metrics.
      setTimeout(function () {
        window.location.reload();
      }, 80);
    }

    var viewportResyncTimer = null;
    var viewportWatchdog = null;
    var maxAppHeight = 0;

    function setAppViewportHeight() {
      var visualH = window.visualViewport ? window.visualViewport.height : 0;
      var innerH = window.innerHeight || 0;
      var docH = document.documentElement ? document.documentElement.clientHeight : 0;
      var measured = Math.max(visualH, innerH, docH);

      if (measured > maxAppHeight) {
        maxAppHeight = measured;
      }

      var nextValue = Math.round(maxAppHeight || measured) + 'px';
      if (document.documentElement.style.getPropertyValue('--app-height') !== nextValue) {
        document.documentElement.style.setProperty('--app-height', nextValue);
      }
    }

    function scheduleViewportResync() {
      if (viewportResyncTimer) {
        clearInterval(viewportResyncTimer);
      }

      var ticks = 0;
      viewportResyncTimer = setInterval(function () {
        setAppViewportHeight();
        window.dispatchEvent(new Event('resize'));
        ticks += 1;
        if (ticks >= 14) {
          clearInterval(viewportResyncTimer);
          viewportResyncTimer = null;
        }
      }, 45);
    }

    setAppViewportHeight();
    setTimeout(setAppViewportHeight, 60);
    setTimeout(setAppViewportHeight, 220);

    // Guaranteed workaround: while keyboard is active, browser back should only
    // close keyboard and must not propagate to Flutter route pop handlers.
    window.addEventListener('popstate', trapBackWhenKeyboardActive, true);

    // Some Android browsers don't reliably emit viewport events on back-key
    // keyboard dismiss; this watchdog keeps height in sync.
    viewportWatchdog = setInterval(setAppViewportHeight, 250);

    window.addEventListener('resize', setAppViewportHeight);
    window.addEventListener('orientationchange', function () {
      maxAppHeight = 0;
      scheduleViewportResync();
    });
    window.addEventListener('pageshow', scheduleViewportResync);
    window.addEventListener('popstate', function () {
      if (!consumeBackForKeyboard()) {
        scheduleViewportResync();
      }
    });
    window.addEventListener('focus', scheduleViewportResync);
    window.addEventListener('blur', scheduleViewportResync);
    document.addEventListener('focusin', function () {
      scheduleViewportResync();
      keyboardRecentUntil = Date.now() + 5000;
      if (hasActiveEditable()) {
        armBackGuard();
      }
    });
    document.addEventListener('focusout', function () {
      scheduleViewportResync();
      keyboardRecentUntil = Date.now() + 1500;
      setTimeout(function () {
        if (!hasActiveEditable() && !isKeyboardLikelyOpen()) {
          backGuardActive = false;
        }
      }, 120);
    });
    window.addEventListener('beforeunload', function () {
      if (viewportWatchdog) {
        clearInterval(viewportWatchdog);
      }
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) {
        scheduleViewportResync();
      }
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', setAppViewportHeight);
      window.visualViewport.addEventListener('scroll', setAppViewportHeight);
    }

    function resetViewportAfterHistoryNav() {
      window.scrollTo(0, 0);
      scheduleViewportResync();
    }

    window.addEventListener('pageshow', resetViewportAfterHistoryNav);
    window.addEventListener('popstate', function () {
      if (!hasActiveEditable() && !isKeyboardLikelyOpen()) {
        resetViewportAfterHistoryNav();
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }

    if (window.caches) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }

    localStorage.clear();
    sessionStorage.clear();
  </script>

  <!-- MediaPipe Face Mesh -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <!-- face_detector.js (uses requestAnimationFrame, no Camera util needed) -->
  <script src="face_detector.js"></script>

  <!-- Flutter LAST -->
<script src="flutter_bootstrap.js"></script>
  <script>
    function hideLoadingOverlay() {
      var loader = document.getElementById('loading');
      if (!loader || loader.classList.contains('hidden')) return;
      loader.classList.add('hidden');
      setTimeout(function () {
        if (loader && loader.parentNode) {
          loader.parentNode.removeChild(loader);
        }
      }, 260);
    }

    window.addEventListener('flutter-first-frame', hideLoadingOverlay);

    var flutterReadyObserver = new MutationObserver(function () {
      var pane = document.querySelector('flt-glass-pane');
      if (pane) {
        hideLoadingOverlay();
        flutterReadyObserver.disconnect();
      }
    });

    flutterReadyObserver.observe(document.body, {
      childList: true,
      subtree: true
    });

    function openRazorpayCheckout(orderId, key, amount, name, email, number) {
      console.log('Opening Razorpay Checkout...');

      var options = {
        key: key,
        amount: amount,
        currency: "INR",
        name: "Skin Analysis",
        description: "Unlock Full Skin Analysis Report",
        handler: function (response) {
          if (window.flutterPaymentSuccess) {
            window.flutterPaymentSuccess(response.razorpay_payment_id);
          }

          window.postMessage({
            type: 'payment_success',
            paymentId: response.razorpay_payment_id
          }, '*');
        },
        modal: {
          ondismiss: function() {
            if (window.flutterPaymentError) {
              window.flutterPaymentError("payment_cancelled");
            }

            window.postMessage({
              type: 'payment_error',
              error: 'payment_cancelled'
            }, '*');
          }
        },
        prefill: {
          name: name || '',
          email: email || '',
          contact: number || '',
        },
        theme: {
          color: "#D4999F"
        }
      };

      try {
        var rzp = new Razorpay(options);

        rzp.on('payment.failed', function (response) {
          if (window.flutterPaymentError) {
            window.flutterPaymentError("payment_failed");
          }
        });

        rzp.open();
      } catch (error) {
        console.error('Razorpay error:', error);
      }
    }

    window.flutterPaymentSuccess = null;
    window.flutterPaymentError = null;
  </script>

</body>
</html>
