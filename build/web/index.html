  <!--
    Patch getUserMedia BEFORE Flutter loads so the camera plugin gets portrait
    constraints on mobile phones.  Desktop is left untouched.

    Why:  Flutter's ResolutionPreset.high requests 1280×720 (landscape 16:9).
    On a portrait phone (≈390×844) that stream would be FittedBox-scaled with a
    ~3.8× zoom factor, causing the zoomed/blurry appearance.
    Requesting height:1280 / width:720 gives the browser a portrait 9:16 stream
    whose aspect ratio matches the phone screen → minimal cropping / no zoom.
  -->
  <script>
  /*
   * Camera stream patch — runs before Flutter loads.
   *
   * PREVIOUS APPROACH (WRONG):
   *   Forced width:720 / height:1280 / aspectRatio:9/16.
   *   This caused Android Chrome to use resizeMode:'crop-and-scale':
   *   it took the full-width native sensor feed, cropped the center strip
   *   to 9:16 portrait, then scaled it up → pre-zoomed stream.
   *   Combined with object-fit:cover in the rendering layer this became
   *   a double-crop → extremely narrow FOV, face looks unnaturally large.
   *
   * CORRECT APPROACH:
   *   Request the native sensor stream (landscape, no aspect-ratio forcing).
   *   resizeMode:'none' explicitly asks the browser NOT to crop-and-scale.
   *   The rendering layer (CameraLayoutManager + Dart FittedBox) handles
   *   the single correct portrait display crop — same as Instagram/Snapchat.
   *
   *   If resizeMode:'none' is unavailable (older browsers), the max:1920/1080
   *   caps resolution without forcing a specific ratio so the browser still
   *   returns its natural landscape mode instead of portrait crop-and-scale.
   */
  (function patchCameraStream() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;

    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if (!isMobile) return;

    var _orig = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);

    navigator.mediaDevices.getUserMedia = function (constraints) {
      if (constraints && constraints.video) {
        try {
          var vc = (typeof constraints.video === 'object')
            ? JSON.parse(JSON.stringify(constraints.video))
            : {};

          var facingMode = vc.facingMode || { ideal: 'user' };

          constraints = Object.assign({}, constraints, {
            video: {
              facingMode:  facingMode,
              // Cap resolution for performance — do NOT specify aspectRatio or
              // height > width (that triggers crop-and-scale mode in Android Chrome).
              width:       { ideal: 1280, max: 1920 },
              height:      { ideal: 720,  max: 1080 },
              frameRate:   { ideal: 30,   max: 30   },
              // Prefer native sensor output. Chrome 86+: prevents crop-and-scale.
              // Silently ignored on browsers that don't support this constraint.
              resizeMode:  'none',
            }
          });
        } catch (e) {
          console.warn('[CameraPatch] constraint error:', e);
        }
      }

      var promise = _orig(constraints);

      // Diagnostics: log what the browser actually returned.
      if (promise && typeof promise.then === 'function') {
        promise.then(function (stream) {
          if (!stream) return;
          var track = stream.getVideoTracks()[0];
          if (!track) return;
          try {
            var s = track.getSettings();
            console.log('[CameraDiag] getSettings():', {
              width:       s.width,
              height:      s.height,
              aspectRatio: s.aspectRatio ? (+s.aspectRatio).toFixed(3) : 'n/a',
              frameRate:   s.frameRate,
              facingMode:  s.facingMode,
              resizeMode:  s.resizeMode,  // 'none' = native FOV  'crop-and-scale' = ZOOM
            });
            if (s.resizeMode === 'crop-and-scale') {
              console.warn('[CameraDiag] resizeMode=crop-and-scale — stream is ' +
                'pre-cropped. Attempting renegotiation with resizeMode:none …');
              track.applyConstraints({ resizeMode: 'none' })
                .then(function () {
                  console.log('[CameraDiag] renegotiated:', track.getSettings());
                })
                .catch(function (err) {
                  console.warn('[CameraDiag] resizeMode:none rejected by device:', err.message || err);
                });
            }
            var caps = track.getCapabilities ? track.getCapabilities() : null;
            if (caps) {
              console.log('[CameraDiag] getCapabilities():', {
                width:      caps.width,
                height:     caps.height,
                resizeMode: caps.resizeMode,
                facingMode: caps.facingMode,
              });
            }
          } catch (e) {
            console.warn('[CameraDiag] could not read track info:', e);
          }
        }).catch(function () {});
      }

      return promise;
    };

    console.log('[CameraPatch] getUserMedia patched — native dims, no portrait forcing');
  })();
  </script>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <title>Skin Analysis</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      /* Use fill-available / dvh so the app never extends behind browser chrome */
      height: 100vh;
      height: -webkit-fill-available; /* iOS Safari < 15.4 */
      overflow: hidden;
      background-color: #F5E6E8;
    }

    #flutter_host {
      width: 100vw;
      /* Layered fallbacks: static vh → webkit fill → dynamic viewport */
      height: 100vh;
      height: -webkit-fill-available;
      height: 100dvh; /* Chrome 108+, Safari 15.4+, Firefox 116+ */
      position: fixed;
      inset: 0;
    }

    /*
     * Flutter web camera plugin injects <video> elements into the DOM.
     * object-fit: cover   → fills the Flutter-sized box without distortion
     * transform: scaleX(-1) → mirrors for front-facing selfie camera
     * fixVideoRendering() in face_detector.js sets these inline as well
     * (inline wins over this rule, so both are safe to have).
     */
    video {
      object-fit: cover;
      transform: scaleX(-1);
    }

    #loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100dvh;
      height: 100vh; /* fallback for old browsers */
      background-color: #F5E6E8;
    }

    .loader {
      border: 5px solid #f3f3f3;
      border-top: 5px solid #D4999F;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 20px;
      color: #6B3E3E;
      font-family: 'Roboto', sans-serif;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div id="loading">
    <div class="loader"></div>
    <div class="loading-text">Loading Skin Analysis...</div>
  </div>

  <div id="flutter_host"></div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }

    if (window.caches) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }

    localStorage.clear();
    sessionStorage.clear();
  </script>

  <!-- MediaPipe Face Mesh -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <!-- face_detector.js (uses requestAnimationFrame, no Camera util needed) -->
  <script src="face_detector.js"></script>

  <!-- Flutter LAST -->
<script src="flutter_bootstrap.js"></script>
  <script>
    function openRazorpayCheckout(orderId, key, amount, name, email, number) {
      console.log('Opening Razorpay Checkout...');

      var options = {
        key: key,
        amount: amount,
        currency: "INR",
        name: "Skin Analysis",
        description: "Unlock Full Skin Analysis Report",
        handler: function (response) {
          if (window.flutterPaymentSuccess) {
            window.flutterPaymentSuccess(response.razorpay_payment_id);
          }

          window.postMessage({
            type: 'payment_success',
            paymentId: response.razorpay_payment_id
          }, '*');
        },
        modal: {
          ondismiss: function() {
            if (window.flutterPaymentError) {
              window.flutterPaymentError("payment_cancelled");
            }

            window.postMessage({
              type: 'payment_error',
              error: 'payment_cancelled'
            }, '*');
          }
        },
        prefill: {
          name: name || '',
          email: email || '',
          contact: number || '',
        },
        theme: {
          color: "#D4999F"
        }
      };

      try {
        var rzp = new Razorpay(options);

        rzp.on('payment.failed', function (response) {
          if (window.flutterPaymentError) {
            window.flutterPaymentError("payment_failed");
          }
        });

        rzp.open();
      } catch (error) {
        console.error('Razorpay error:', error);
      }
    }

    window.flutterPaymentSuccess = null;
    window.flutterPaymentError = null;
  </script>

</body>
</html>
