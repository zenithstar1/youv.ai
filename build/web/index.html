<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Skin Analysis Application">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=()">
  <meta name="referrer" content="no-referrer">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Skin Analysis">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <title>Skin Analysis</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      height: 100vh; /* fallback for older browsers */
      overflow: hidden;
      background-color: #FDF8F3;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* Force Flutter canvas to always fill the real screen */
    flutter-view,
    flt-glass-pane,
    flt-scene-host,
    flt-scene {
      display: block !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      min-height: 100vh !important;
      min-height: 100dvh !important;
      overflow: hidden !important;
    }

    video {
      transform: scaleX(-1);
      /* Override camera_web plugin's object-fit:cover which zooms the
         face to fill the container.  'contain' preserves the native
         aspect ratio so the full face is visible inside the oval guide. */
      object-fit: contain !important;
    }

    #loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: fixed;
      inset: 0;
      height: 100%;
      background-color: #FDF8F3;
      z-index: 9999;
      opacity: 1;
      visibility: visible;
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    #loading.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader {
      border: 5px solid #f3f3f3;
      border-top: 5px solid #D4999F;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 20px;
      color: #6B3E3E;
      font-family: 'Roboto', sans-serif;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div id="loading">
    <div class="loader"></div>
    <div class="loading-text">Loading Skin Analysis...</div>
  </div>

  <script>
    // ── Android keyboard viewport fix ──
    // Core problem: When Android back button dismisses keyboard, Chrome
    // leaves window.innerHeight at the reduced (keyboard-open) value.
    // Flutter sizes its canvas to window.innerHeight, so a gap appears.
    //
    // Fix: Directly measure the real screen height and force it onto
    // Flutter's canvas elements every time the viewport changes.
    (function () {
      var vv = window.visualViewport;

      // Get the REAL full screen height
      function getRealHeight() {
        // screen.availHeight is the OS-reported available height (never affected by keyboard)
        // visualViewport.height when keyboard is closed = real height
        // window.outerHeight is the browser window height
        var candidates = [
          window.screen ? window.screen.availHeight : 0,
          window.outerHeight || 0,
          vv ? vv.height : 0,
          window.innerHeight || 0
        ];
        return Math.max.apply(null, candidates);
      }

      var fullHeight = getRealHeight();

      // Apply the real height to all Flutter canvas elements
      function enforceFullHeight() {
        var h = getRealHeight();
        // Only update fullHeight upward (keyboard can't make screen taller)
        if (h > fullHeight) fullHeight = h;

        var px = fullHeight + 'px';
        var targets = document.querySelectorAll('flutter-view, flt-glass-pane, flt-scene-host, flt-scene');
        for (var i = 0; i < targets.length; i++) {
          var el = targets[i];
          if (el.style.height !== px) {
            el.style.setProperty('height', px, 'important');
            el.style.setProperty('min-height', px, 'important');
          }
        }

        // Also fix html/body
        document.documentElement.style.height = px;
        document.body.style.height = px;
      }

      // Force Chrome to recalculate by toggling meta viewport
      function forceViewportRecalc() {
        window.scrollTo(0, 0);
        var vp = document.querySelector('meta[name="viewport"]');
        if (vp) {
          var orig = vp.getAttribute('content');
          vp.setAttribute('content', orig + ', minimum-scale=0.99');
          requestAnimationFrame(function () {
            vp.setAttribute('content', orig);
            enforceFullHeight();
            window.dispatchEvent(new Event('resize'));
          });
        }
        enforceFullHeight();
        window.dispatchEvent(new Event('resize'));
      }

      // Detect keyboard open/close via visualViewport
      if (vv) {
        var kbOpen = false;
        vv.addEventListener('resize', function () {
          var h = vv.height;
          if (h < fullHeight - 100) {
            kbOpen = true;
          }
          if (kbOpen && h >= fullHeight - 50) {
            kbOpen = false;
            forceViewportRecalc();
            setTimeout(forceViewportRecalc, 200);
            setTimeout(forceViewportRecalc, 500);
          }
        });
      }

      // On any input losing focus, force recalc
      document.addEventListener('focusout', function (e) {
        var tag = (e.target && e.target.tagName || '').toUpperCase();
        if (tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable)) {
          setTimeout(forceViewportRecalc, 100);
          setTimeout(forceViewportRecalc, 300);
          setTimeout(forceViewportRecalc, 600);
        }
      });

      // Continuous watchdog: check every 500ms and fix if needed
      setInterval(enforceFullHeight, 500);

      // Also run on resize, orientation change
      window.addEventListener('resize', enforceFullHeight);
      window.addEventListener('orientationchange', function () {
        fullHeight = 0; // reset so it picks up new orientation height
        setTimeout(enforceFullHeight, 200);
        setTimeout(enforceFullHeight, 600);
      });

      // Run immediately and after short delays
      enforceFullHeight();
      setTimeout(enforceFullHeight, 100);
      setTimeout(enforceFullHeight, 500);
      setTimeout(enforceFullHeight, 1500);
    })();

    // Clean up stale service workers
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
  </script>

  <!-- MediaPipe Face Mesh -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <!-- face_detector.js (uses requestAnimationFrame, no Camera util needed) -->
  <script src="face_detector.js"></script>

  <!-- Flutter LAST -->
<script src="flutter_bootstrap.js"></script>
  <script>
    function hideLoadingOverlay() {
      var loader = document.getElementById('loading');
      if (!loader || loader.classList.contains('hidden')) return;
      loader.classList.add('hidden');
      setTimeout(function () {
        if (loader && loader.parentNode) {
          loader.parentNode.removeChild(loader);
        }
      }, 260);
    }

    window.addEventListener('flutter-first-frame', hideLoadingOverlay);

    var flutterReadyObserver = new MutationObserver(function () {
      var pane = document.querySelector('flt-glass-pane');
      if (pane) {
        hideLoadingOverlay();
        flutterReadyObserver.disconnect();
      }
    });

    flutterReadyObserver.observe(document.body, {
      childList: true,
      subtree: true
    });

    function openRazorpayCheckout(orderId, key, amount, name, email, number) {
      console.log('Opening Razorpay Checkout...');

      var options = {
        key: key,
        amount: amount,
        currency: "INR",
        name: "Skin Analysis",
        description: "Unlock Full Skin Analysis Report",
        handler: function (response) {
          if (window.flutterPaymentSuccess) {
            window.flutterPaymentSuccess(response.razorpay_payment_id);
          }

          window.postMessage({
            type: 'payment_success',
            paymentId: response.razorpay_payment_id
          }, '*');
        },
        modal: {
          ondismiss: function() {
            if (window.flutterPaymentError) {
              window.flutterPaymentError("payment_cancelled");
            }

            window.postMessage({
              type: 'payment_error',
              error: 'payment_cancelled'
            }, '*');
          }
        },
        prefill: {
          name: name || '',
          email: email || '',
          contact: number || '',
        },
        theme: {
          color: "#D4999F"
        }
      };

      try {
        var rzp = new Razorpay(options);

        rzp.on('payment.failed', function (response) {
          if (window.flutterPaymentError) {
            window.flutterPaymentError("payment_failed");
          }
        });

        rzp.open();
      } catch (error) {
        console.error('Razorpay error:', error);
      }
    }

    window.flutterPaymentSuccess = null;
    window.flutterPaymentError = null;
  </script>

</body>
</html>
