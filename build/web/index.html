<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Skin Analysis Application">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=()">
  <meta name="referrer" content="no-referrer">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Skin Analysis">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <title>Skin Analysis</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #FDF8F3;
    }

    video {
      transform: scaleX(-1);
      /* Override camera_web plugin's object-fit:cover which zooms the
         face to fill the container.  'contain' preserves the native
         aspect ratio so the full face is visible inside the oval guide. */
      object-fit: contain !important;
    }

    #loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: fixed;
      inset: 0;
      height: 100%;
      background-color: #FDF8F3;
      z-index: 9999;
      opacity: 1;
      visibility: visible;
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    #loading.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader {
      border: 5px solid #f3f3f3;
      border-top: 5px solid #D4999F;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 20px;
      color: #6B3E3E;
      font-family: 'Roboto', sans-serif;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div id="loading">
    <div class="loader"></div>
    <div class="loading-text">Loading Skin Analysis...</div>
  </div>

  <script>
    // ── Android Chrome back-button keyboard-dismiss viewport fix ──
    // When the Android back button closes the soft keyboard, Chrome
    // sometimes fails to resize Flutter's canvas.  We detect the
    // keyboard closing via visualViewport.resize and force the browser
    // to recalculate the viewport by toggling the <meta viewport> tag,
    // then dispatch a resize event so Flutter re-measures.
    (function () {
      var vv = window.visualViewport;
      if (!vv) return;

      var stableH = vv.height;
      var kbOpen  = false;

      vv.addEventListener('resize', function () {
        var h = vv.height;

        // Keyboard opened (viewport shrank significantly)
        if (h < stableH - 60) {
          kbOpen = true;
        }

        // Keyboard closed (viewport returned near stable height)
        if (kbOpen && h >= stableH - 30) {
          kbOpen = false;

          window.scrollTo(0, 0);

          // Toggle meta-viewport to force Chrome to recalculate innerHeight
          var vp = document.querySelector('meta[name="viewport"]');
          if (vp) {
            var orig = vp.getAttribute('content');
            vp.setAttribute('content', orig + ', minimum-scale=0.99');
            requestAnimationFrame(function () {
              vp.setAttribute('content', orig);
              window.dispatchEvent(new Event('resize'));
            });
          } else {
            window.dispatchEvent(new Event('resize'));
          }

          // Second nudge after a short delay for slower devices
          setTimeout(function () {
            window.dispatchEvent(new Event('resize'));
          }, 150);
        }

        // Track stable height only when keyboard is closed
        if (!kbOpen) stableH = h;
      });
    })();

    // Clean up stale service workers
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
  </script>

  <!-- MediaPipe Face Mesh -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <!-- face_detector.js (uses requestAnimationFrame, no Camera util needed) -->
  <script src="face_detector.js"></script>

  <!-- Flutter LAST -->
<script src="flutter_bootstrap.js"></script>
  <script>
    function hideLoadingOverlay() {
      var loader = document.getElementById('loading');
      if (!loader || loader.classList.contains('hidden')) return;
      loader.classList.add('hidden');
      setTimeout(function () {
        if (loader && loader.parentNode) {
          loader.parentNode.removeChild(loader);
        }
      }, 260);
    }

    window.addEventListener('flutter-first-frame', hideLoadingOverlay);

    var flutterReadyObserver = new MutationObserver(function () {
      var pane = document.querySelector('flt-glass-pane');
      if (pane) {
        hideLoadingOverlay();
        flutterReadyObserver.disconnect();
      }
    });

    flutterReadyObserver.observe(document.body, {
      childList: true,
      subtree: true
    });

    function openRazorpayCheckout(orderId, key, amount, name, email, number) {
      console.log('Opening Razorpay Checkout...');

      var options = {
        key: key,
        amount: amount,
        currency: "INR",
        name: "Skin Analysis",
        description: "Unlock Full Skin Analysis Report",
        handler: function (response) {
          if (window.flutterPaymentSuccess) {
            window.flutterPaymentSuccess(response.razorpay_payment_id);
          }

          window.postMessage({
            type: 'payment_success',
            paymentId: response.razorpay_payment_id
          }, '*');
        },
        modal: {
          ondismiss: function() {
            if (window.flutterPaymentError) {
              window.flutterPaymentError("payment_cancelled");
            }

            window.postMessage({
              type: 'payment_error',
              error: 'payment_cancelled'
            }, '*');
          }
        },
        prefill: {
          name: name || '',
          email: email || '',
          contact: number || '',
        },
        theme: {
          color: "#D4999F"
        }
      };

      try {
        var rzp = new Razorpay(options);

        rzp.on('payment.failed', function (response) {
          if (window.flutterPaymentError) {
            window.flutterPaymentError("payment_failed");
          }
        });

        rzp.open();
      } catch (error) {
        console.error('Razorpay error:', error);
      }
    }

    window.flutterPaymentSuccess = null;
    window.flutterPaymentError = null;
  </script>

</body>
</html>
