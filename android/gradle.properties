# Keep Gradle memory within the ~7–8 GB laptop RAM.
# Previous -Xmx8G + MaxMetaspaceSize=4G caused the daemon to OOM/crash.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true
android.newDsl=false
